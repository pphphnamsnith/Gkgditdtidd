
name: Secure Windows RDP

on:
  workflow_dispatch:

permissions: {}

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Validate required secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing required secret: RDP_PASSWORD"
          }

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "Missing required secret: TAILSCALE_AUTH_KEY"
          }

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:TEMP "tailscale.msi"

          try {
            Invoke-WebRequest `
              -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
              -OutFile $installer

            $process = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList @(
                "/i",
                "`"$installer`"",
                "/quiet",
                "/norestart"
              ) `
              -Wait `
              -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed."
            }

            $ts = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"

            if (-not (Test-Path $ts)) {
              throw "Tailscale executable was not found."
            }

            & $ts up `
              "--authkey=$env:TS_AUTHKEY" `
              "--hostname=github-rdp-$env:GITHUB_RUN_ID"

            if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
            }

            $ip = & $ts ip -4

            if ($LASTEXITCODE -ne 0 -or -not $ip) {
              throw "Unable to obtain Tailscale IPv4 address."
            }

            Write-Output "Tailscale connected successfully."
            Write-Output "Tailscale IPv4: $ip"
          }
          finally {
            Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }

      - name: Configure RDP account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires | Out-Null
          }
          else {
            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }

          $member = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction Stop |
            Where-Object { $_.Name -eq "$env:COMPUTERNAME\RDP" }

          if (-not $member) {
            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP"
          }

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Output "RDP account configured."
